name: Android build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    # A cold run downloads Gradle, the Android Gradle Plugin and the whole
    # Compose toolchain before it compiles anything, and the hosted runners have
    # been slow at it. Once this run seeds the Gradle cache, later ones are
    # minutes rather than the best part of an hour.
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      # The NDK version is pinned in app/build.gradle.kts; installing it
      # explicitly keeps the build from depending on whatever the runner image
      # happens to ship this month.
      - name: Install NDK and CMake
        run: |
          sdkmanager --install "ndk;27.2.12479018" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Write the cache from every branch, not just the default one. A cold
          # run here downloads Gradle plus the whole Compose toolchain and takes
          # the best part of half an hour; a warm one is a couple of minutes.
          cache-read-only: false

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # One Gradle invocation rather than several: each separate run pays the
      # whole configuration and daemon start-up cost again. Lint deliberately
      # stays off this path so nothing delays the APK - run ./gradlew lintDebug
      # locally, or use the lint job below.
      - name: Test and build
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace

      # Named so it is obvious in the Actions UI which file to download.
      - name: Rename APK
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/JoyMergeQuest-debug.apk
          ls -la artifacts

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JoyMergeQuest-APK
          path: artifacts/JoyMergeQuest-debug.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JoyMergeQuest-reports
          path: |
            app/build/reports/tests/**
            app/build/test-results/**
          if-no-files-found: warn
          retention-days: 14

      - name: Summary
        if: always()
        run: |
          {
            echo "## JoyMerge Quest build"
            echo ""
            if [ -f artifacts/JoyMergeQuest-debug.apk ]; then
              echo "APK: \`JoyMergeQuest-debug.apk\` ($(du -h artifacts/JoyMergeQuest-debug.apk | cut -f1))"
              echo ""
              echo "Download it from the **JoyMergeQuest-APK** artifact on this run."
            else
              echo "No APK was produced - check the build logs above."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  lint:
    name: Android Lint
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Advisory only. Lint findings are worth seeing, but they must never stand
    # between a push and a downloadable APK.
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run Android Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JoyMergeQuest-lint
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: warn
          retention-days: 14
