name: Android build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    # A cold run downloads Gradle, the Android Gradle Plugin and the whole
    # Compose toolchain before it compiles anything. Warm runs are minutes.
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      # The NDK version is pinned in app/build.gradle.kts; installing it
      # explicitly keeps the build from depending on whatever the runner image
      # happens to ship this month.
      - name: Install NDK and CMake
        run: |
          sdkmanager --install "ndk;27.2.12479018" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Write the cache from every branch, not just the default one. A cold
          # run here downloads Gradle plus the whole Compose toolchain and takes
          # the best part of half an hour; a warm one is a couple of minutes.
          cache-read-only: false

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # One Gradle invocation rather than three: each separate run pays the
      # whole configuration and daemon start-up cost again, which on a cold
      # runner is the difference between minutes and tens of minutes.
      - name: Test, lint and build
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace

      # Named so it is obvious in the Actions UI which file to download.
      - name: Rename APK
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/JoyMergeQuest-debug.apk
          ls -la artifacts

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JoyMergeQuest-APK
          path: artifacts/JoyMergeQuest-debug.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JoyMergeQuest-reports
          path: |
            app/build/reports/tests/**
            app/build/reports/lint-results-debug.html
            app/build/test-results/**
          if-no-files-found: warn
          retention-days: 14

      - name: Summary
        if: always()
        run: |
          {
            echo "## JoyMerge Quest build"
            echo ""
            if [ -f artifacts/JoyMergeQuest-debug.apk ]; then
              echo "APK: \`JoyMergeQuest-debug.apk\` ($(du -h artifacts/JoyMergeQuest-debug.apk | cut -f1))"
              echo ""
              echo "Download it from the **JoyMergeQuest-APK** artifact on this run."
            else
              echo "No APK was produced - check the build logs above."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
